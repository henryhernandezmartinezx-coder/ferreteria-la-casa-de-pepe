
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10263a">
  <title>Ferretería La Casa de Pepe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      color: #fff;
      background-color: #10263a;
      background-image:
        linear-gradient(rgba(8,22,38,.58), rgba(8,22,38,.65));
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    main {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #fff;
      text-shadow: 0 2px 5px #102030;
      margin: 8px 0;
      font-size: clamp(23px, 4vw, 32px);
    }

    .subtitulo {
      text-align: center;
      text-shadow: 0 1px 4px #102030;
      margin: 8px 0 20px;
    }

    #busqueda {
      display: block;
      width: 100%;
      padding: 15px;
      font-size: 17px;
      border: 2px solid #d4a13c;
      border-radius: 9px;
      background: #fff;
      color: #202938;
      outline-offset: 2px;
    }

    .titulo-categorias {
      margin: 15px 0 8px;
      font-weight: bold;
      text-shadow: 0 1px 3px #102030;
    }

    .botones {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 12px;
    }

    .botones button {
      padding: 11px 5px;
      border: 0;
      border-radius: 8px;
      background: #263746;
      color: #fff;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      min-height: 39px;
    }

    .botones button:hover,
    .botones button.activo {
      background: #e99d13;
      color: #202938;
    }

    #estado {
      margin: 12px 0;
      text-align: center;
      color: #fff;
      font-size: 13px;
      text-shadow: 0 1px 4px #102030;
      overflow-wrap: anywhere;
    }

    #titulo-resultados {
      margin: 14px 0 8px;
      font-size: 17px;
      text-shadow: 0 1px 4px #102030;
    }

    .producto {
      background: rgba(255,255,255,.97);
      color: #202938;
      border-left: 4px solid #e99d13;
      border-radius: 9px;
      padding: 13px;
      margin: 9px 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.22);
      overflow-wrap: anywhere;
    }

    .nombre {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .datos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .dato {
      background: #f0f1f3;
      border-radius: 6px;
      padding: 8px;
      min-width: 0;
    }

    .etiqueta {
      display: block;
      color: #5d6570;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .valor {
      display: block;
      font-weight: bold;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #mas-resultados {
      display: none;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 0;
      border-radius: 8px;
      background: #e99d13;
      color: #202938;
      font-weight: bold;
      cursor: pointer;
    }

    #boton-cambios {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 12px;
      border: 2px solid #d4a13c;
      border-radius: 9px;
      background: #263746;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #boton-cambios:hover {
      background: #e99d13;
      color: #202938;
    }

    #cantidad-cambios {
      margin-left: 5px;
      color: #ffd477;
    }

    #aviso-cambios {
      margin: 12px 0;
      padding: 12px;
      border-left: 4px solid #e99d13;
      border-radius: 7px;
      background: rgba(255,255,255,.96);
      color: #202938;
      font-weight: bold;
    }

    #panel-cambios {
      margin: 12px 0;
      padding: 14px;
      border-radius: 9px;
      background: rgba(255,255,255,.97);
      color: #202938;
    }

    #panel-cambios h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .cambio-producto {
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
      overflow-wrap: anywhere;
    }

    .tipo-cambio {
      display: inline-block;
      margin-bottom: 5px;
      padding: 4px 7px;
      border-radius: 5px;
      background: #e5efe7;
      color: #225a3c;
      font-size: 12px;
      font-weight: bold;
    }

    #cerrar-cambios {
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      border: 0;
      border-radius: 7px;
      background: #263746;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #panel-cambios[hidden],
    #aviso-cambios[hidden] {
      display: none;
    }

    @media (max-width: 420px) {
      body {
        padding: 18px 10px;
      }

      .botones {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .datos {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 320px) {
      .datos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Ferretería La Casa de Pepe</h1>

    <div class="subtitulo">
      Consulta de productos, existencias y precios
    </div>

    <div id="aviso-cambios" role="status" hidden></div>

    <button
      id="boton-cambios"
      type="button"
      aria-expanded="false">
      🔔 Cambios recientes
      <span id="cantidad-cambios"></span>
    </button>

    <section id="panel-cambios" hidden>
      <h2>Novedades del catálogo</h2>
      <p id="resumen-cambios"></p>
      <div id="lista-cambios"></div>

      <button id="cerrar-cambios" type="button">
        Cerrar novedades
      </button>
    </section>

    <input
      id="busqueda"
      type="search"
      placeholder="Buscar un producto..."
      autocomplete="off"
      aria-label="Buscar productos"
    >

    <div class="titulo-categorias">Categorías</div>

    <div class="botones" id="botones">
      <button type="button" data-categoria="Todos" class="activo">Todos</button>
      <button type="button" data-categoria="Tornilleria">Tornillería</button>
      <button type="button" data-categoria="Electricidad">Electricidad</button>
      <button type="button" data-categoria="Herramientas">Herramientas</button>
      <button type="button" data-categoria="Plomeria">Plomería</button>
      <button type="button" data-categoria="Electrodomesticos">Electrodomésticos</button>
    </div>

    <div id="estado" role="status" aria-live="polite">
      Preparando catálogo...
    </div>

    <h2 id="titulo-resultados">Productos</h2>
    <div id="resultados"></div>

    <button id="mas-resultados" type="button">
      Mostrar más productos
    </button>
  </main>

  <script>
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbzDQvqR-gAlHqE-NtH-FIF7vsZEo0EaEE1oHY8ka4IDjTqi7TZ9A3rKooJ0ZGHiDXcsxg/exec";

    const CLAVE_CACHE = "casaPepe_catalogo_v1";
    const CLAVE_IMAGEN = "casaPepe_imagen_fondo_v1";
    const CLAVE_CAMBIOS = "casaPepe_cambios_recientes_v1";
    const LIMITE_INICIAL = 100;

    const CATEGORIAS = {
      Tornilleria: [
        "tornillo", "cancamo", "tuerca", "tuercas",
        "arandela", "arandela de presion", "perno", "pernos",
        "clavo", "puntilla", "tirafondo", "expansion"
      ],

      Electricidad: [
        "cable", "electrico", "electricidad", "breaker",
        "caja", "brequera", "tomacorriente", "interruptor",
        "enchufe", "bombillo", "solar", "led", "lampara",
        "coaxial", "perrito", "fusible",
        "conector electrico", "cinta aislante", "canaleta",
        "toma corriente", "socket", "apagador", "tape",
        "terminal electrico", "terminales electricos",
        "royal cord", "espiga", "adaptador", "plano",
        "telefono", "cargador", "cuchilla", "catado"
      ],

      Herramientas: [
        "martillo", "alicate", "pinza", "destornillador",
        "llave inglesa", "serrucho", "sierra", "lima",
        "taladro", "broca", "cinta metrica", "metro",
        "nivel", "stilson", "cincel", "prensa", "tenaza",
        "brocha", "llave ajustable"
      ],

      Plomeria: [
        "zapatilla", "pvc", "codo", "empotrar", "teflon",
        "nudo", "niple", "tee", "yee", "tubo", "1/2",
        '1"', "3/4", "tiro rapido", "anti hongo"
      ],

      Electrodomesticos: [
        "ventilador", "refrigerador", "nevera", "lavadora",
        "inflarrojo", "batidora", "split", "cafetera",
        "plancha bosina", "microondas", "televisor", "olla"
      ]
    };

    let catalogo = [];
    let filtrados = [];
    let categoriaActiva = "Todos";
    let temporizador = null;
    let cantidadVisible = LIMITE_INICIAL;

    const entrada = document.getElementById("busqueda");
    const estado = document.getElementById("estado");
    const resultados = document.getElementById("resultados");
    const titulo = document.getElementById("titulo-resultados");
    const botonMas = document.getElementById("mas-resultados");

    const botonCambios = document.getElementById("boton-cambios");
    const cantidadCambios = document.getElementById("cantidad-cambios");
    const avisoCambios = document.getElementById("aviso-cambios");
    const panelCambios = document.getElementById("panel-cambios");
    const resumenCambios = document.getElementById("resumen-cambios");
    const listaCambios = document.getElementById("lista-cambios");
    const cerrarCambios = document.getElementById("cerrar-cambios");

    // Normalizar palabras para comparar sin distinguir tildes ni mayúsculas.
    function normalizar(valor) {
      return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    // Calcular la distancia entre palabras para tolerar errores de escritura.
    function distancia(a, b) {
      const matriz = Array.from(
        { length: a.length + 1 },
        () => Array(b.length + 1).fill(0)
      );

      for (let i = 0; i <= a.length; i++) matriz[i][0] = i;
      for (let j = 0; j <= b.length; j++) matriz[0][j] = j;

      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          const costo = a[i - 1] === b[j - 1] ? 0 : 1;

          matriz[i][j] = Math.min(
            matriz[i - 1][j] + 1,
            matriz[i][j - 1] + 1,
            matriz[i - 1][j - 1] + costo
          );
        }
      }

      return matriz[a.length][b.length];
    }

    function coincideBusqueda(producto, consulta) {
      if (!consulta) return true;

      const nombre = normalizar(producto);

      if (nombre.includes(consulta)) return true;

      const palabrasConsulta = consulta.split(/\s+/).filter(Boolean);
      const palabrasNombre = nombre.split(/[\s\-_/]+/).filter(Boolean);

      return palabrasConsulta.every(palabra => {
        if (nombre.includes(palabra)) return true;
        if (palabra.length < 4) return false;

        return palabrasNombre.some(p => {
          const limite = palabra.length >= 6 ? 2 : 1;

          return Math.abs(p.length - palabra.length) <= limite &&
            distancia(palabra, p) <= limite;
        });
      });
    }

    function coincideCategoria(producto, categoria) {
      if (categoria === "Todos") return true;

      const terminos = CATEGORIAS[categoria] || [];
      const nombre = normalizar(producto);

      if (
        normalizar(categoria) === "electrodomesticos" &&
        /\bcriolla\b/.test(nombre)
      ) {
        return false;
      }

      return terminos.some(terminoOriginal => {
        const termino = normalizar(terminoOriginal);
        return nombre.includes(termino);
      });
    }

    // Conexión con Google Apps Script usando JSONP.
    function pedirJSONP(accion, tiempoLimite = 25000) {
      return new Promise((resolve, reject) => {
        const callback =
          "casaPepe_" + Date.now() + "_" +
          Math.floor(Math.random() * 100000);

        const script = document.createElement("script");

        const temporizadorError = setTimeout(() => terminar(
          new Error("Se agotó el tiempo de conexión.")
        ), tiempoLimite);

        function terminar(error, datos) {
          clearTimeout(temporizadorError);
          delete window[callback];
          script.remove();

          if (error) reject(error);
          else resolve(datos);
        }

        window[callback] = datos => terminar(null, datos);

        script.onerror = () => terminar(
          new Error("No se pudo conectar con Google Apps Script.")
        );

        script.src = URL_APPS_SCRIPT +
          "?action=" + encodeURIComponent(accion) +
          "&callback=" + encodeURIComponent(callback) +
          "&t=" + Date.now();

        document.head.appendChild(script);
      });
    }

    function normalizarCatalogo(datos) {
      if (Array.isArray(datos)) return datos;

      if (datos && Array.isArray(datos.productos)) {
        return datos.productos;
      }

      if (datos && Array.isArray(datos.catalogo)) {
        return datos.catalogo;
      }

      return [];
    }

    // Funciones de búsqueda y presentación.
    function actualizar() {
      const consulta = normalizar(entrada.value);

      filtrados = catalogo.filter(p =>
        p &&
        typeof p.producto === "string" &&
        coincideCategoria(p.producto, categoriaActiva) &&
        coincideBusqueda(p.producto, consulta)
      );

      cantidadVisible = LIMITE_INICIAL;
      mostrarResultados();
    }

    function mostrarResultados() {
      resultados.replaceChildren();

      const total = filtrados.length;
      const visibles = filtrados.slice(0, cantidadVisible);

      titulo.textContent =
        (categoriaActiva === "Todos"
          ? "Productos"
          : "Categoría: " + categoriaActiva) +
        " (" + total.toLocaleString("es") + ")";

      visibles.forEach(p => {
        const tarjeta = document.createElement("article");
        tarjeta.className = "producto";

        const nombre = document.createElement("div");
        nombre.className = "nombre";
        nombre.textContent = p.producto;

        const datos = document.createElement("div");
        datos.className = "datos";

        datos.appendChild(
          crearDato("Existencia", p.existencia || "—")
        );

        datos.appendChild(
          crearDato("Precio", p.precio || "Consultar")
        );

        tarjeta.append(nombre, datos);
        resultados.appendChild(tarjeta);
      });

      if (!total) {
        const mensaje = document.createElement("p");
        mensaje.textContent = "No se encontraron productos.";
        resultados.appendChild(mensaje);
      }

      botonMas.style.display =
        total > visibles.length ? "block" : "none";
    }

    function crearDato(etiqueta, valor) {
      const caja = document.createElement("div");
      caja.className = "dato";

      const tituloDato = document.createElement("span");
      tituloDato.className = "etiqueta";
      tituloDato.textContent = etiqueta;

      const valorDato = document.createElement("span");
      valorDato.className = "valor";
      valorDato.textContent = valor;

      caja.append(tituloDato, valorDato);
      return caja;
    }

    // Lectura y guardado de la copia local del catálogo.
    function leerCatalogoAnterior() {
      try {
        const guardado = localStorage.getItem(CLAVE_CACHE);
        if (!guardado) return null;

        const copia = JSON.parse(guardado);

        const datos = Array.isArray(copia)
          ? copia
          : copia && Array.isArray(copia.datos)
            ? copia.datos
            : null;

        if (!datos) return null;

        return datos.filter(p =>
          p && typeof p.producto === "string"
        );
      } catch (error) {
        console.error("No se pudo leer el catálogo anterior:", error);
        return null;
      }
    }

    function guardarCatalogo(datos) {
      try {
        localStorage.setItem(CLAVE_CACHE, JSON.stringify({
          fecha: new Date().toISOString(),
          datos: datos
        }));
      } catch (error) {
        console.error("No se pudo guardar el catálogo:", error);
      }
    }

    function cargarCopiaLocal() {
      try {
        const guardado = localStorage.getItem(CLAVE_CACHE);
        if (!guardado) return false;

        const copia = JSON.parse(guardado);

        const datos = Array.isArray(copia)
          ? copia
          : copia && Array.isArray(copia.datos)
            ? copia.datos
            : [];

        catalogo = datos.filter(p =>
          p && typeof p.producto === "string"
        );

        if (!catalogo.length) return false;

        actualizar();

        estado.textContent =
          "Catálogo local recuperado: " +
          catalogo.length.toLocaleString("es") +
          " productos.";

        return true;
      } catch (error) {
        console.error("Error al recuperar el catálogo:", error);
        return false;
      }
    }

    // Comparar la versión anterior con la nueva.
    function compararCatalogos(anterior, nuevo) {
      const mapaAnterior = new Map();
      const mapaNuevo = new Map();
      const cambios = [];

      anterior.forEach(p => {
        if (p && p.producto) {
          mapaAnterior.set(normalizar(p.producto), p);
        }
      });

      nuevo.forEach(p => {
        if (p && p.producto) {
          mapaNuevo.set(normalizar(p.producto), p);
        }
      });

      mapaNuevo.forEach((producto, clave) => {
        const viejo = mapaAnterior.get(clave);

        if (!viejo) {
          cambios.push({
            tipo: "Añadido",
            producto: producto.producto,
            detalles: "Producto añadido al catálogo."
          });
          return;
        }

        const detalles = [];

        if (String(viejo.existencia ?? "") !==
            String(producto.existencia ?? "")) {
          detalles.push(
            "Existencia: " + (viejo.existencia || "vacía") +
            " → " + (producto.existencia || "vacía")
          );
        }

        if (String(viejo.precio ?? "") !==
            String(producto.precio ?? "")) {
          detalles.push(
            "Precio: " + (viejo.precio || "vacío") +
            " → " + (producto.precio || "vacío")
          );
        }

        if (detalles.length) {
          cambios.push({
            tipo: "Modificado",
            producto: producto.producto,
            detalles: detalles.join(" | ")
          });
        }
      });

      mapaAnterior.forEach((producto, clave) => {
        if (!mapaNuevo.has(clave)) {
          cambios.push({
            tipo: "Eliminado",
            producto: producto.producto,
            detalles: "El producto ya no aparece en el catálogo."
          });
        }
      });

      return cambios;
    }

    // Informe de las novedades detectadas.
    function leerInformeCambios() {
      try {
        return JSON.parse(localStorage.getItem(CLAVE_CAMBIOS)) || null;
      } catch (error) {
        return null;
      }
    }

    function actualizarBotonCambios() {
      const informe = leerInformeCambios();
      const cantidad = informe && Array.isArray(informe.cambios)
        ? informe.cambios.length
        : 0;

      cantidadCambios.textContent =
        cantidad ? "(" + cantidad + ")" : "";
    }

    function guardarInformeCambios(cambios) {
      const informe = {
        fecha: new Date().toISOString(),
        cambios: cambios
      };

      try {
        localStorage.setItem(CLAVE_CAMBIOS, JSON.stringify(informe));
      } catch (error) {
        console.error("No se pudo guardar el informe:", error);
      }

      actualizarBotonCambios();
    }

    function mostrarAvisoCambios(cambios) {
      const añadidos = cambios.filter(c => c.tipo === "Añadido").length;
      const modificados = cambios.filter(c => c.tipo === "Modificado").length;
      const eliminados = cambios.filter(c => c.tipo === "Eliminado").length;
      const partes = [];

      if (añadidos) {
        partes.push("se añadieron " + añadidos + " productos");
      }

      if (modificados) {
        partes.push("se modificaron " + modificados + " productos");
      }

      if (eliminados) {
        partes.push("se eliminaron " + eliminados + " productos");
      }

      avisoCambios.textContent =
        "Novedades detectadas: " + partes.join(", ") + ".";

      avisoCambios.hidden = false;
    }

    function abrirPanelCambios() {
      const informe = leerInformeCambios();

      panelCambios.hidden = false;
      botonCambios.setAttribute("aria-expanded", "true");
      listaCambios.replaceChildren();

      if (!informe || !Array.isArray(informe.cambios) ||
          informe.cambios.length === 0) {
        resumenCambios.textContent =
          "Todavía no hay cambios registrados. Se necesita una copia anterior para comparar.";
        return;
      }

      const fecha = new Date(informe.fecha);

      resumenCambios.textContent =
        "Última comparación: " +
        (Number.isNaN(fecha.getTime())
          ? "fecha desconocida"
          : fecha.toLocaleString("es"));

      const añadidos = informe.cambios.filter(c => c.tipo === "Añadido").length;
      const modificados = informe.cambios.filter(c => c.tipo === "Modificado").length;
      const eliminados = informe.cambios.filter(c => c.tipo === "Eliminado").length;

      resumenCambios.textContent +=
        " — Añadidos: " + añadidos +
        ", modificados: " + modificados +
        ", eliminados: " + eliminados + ".";

      informe.cambios.slice(0, 100).forEach(cambio => {
        const fila = document.createElement("div");
        fila.className = "cambio-producto";

        const tipo = document.createElement("span");
        tipo.className = "tipo-cambio";
        tipo.textContent = cambio.tipo;

        const nombre = document.createElement("div");
        nombre.textContent = cambio.producto;

        const detalles = document.createElement("div");
        detalles.textContent = cambio.detalles;

        fila.append(tipo, nombre, detalles);
        listaCambios.appendChild(fila);
      });

      if (informe.cambios.length > 100) {
        const nota = document.createElement("p");
        nota.textContent =
          "Se muestran los primeros 100 cambios de " +
          informe.cambios.length + " registrados.";
        listaCambios.appendChild(nota);
      }
    }

    botonCambios.addEventListener("click", () => {
      if (panelCambios.hidden) {
        abrirPanelCambios();
      } else {
        panelCambios.hidden = true;
        botonCambios.setAttribute("aria-expanded", "false");
      }
    });

    cerrarCambios.addEventListener("click", () => {
      panelCambios.hidden = true;
      botonCambios.setAttribute("aria-expanded", "false");
    });

    actualizarBotonCambios();

    // Descargar, comparar y guardar el catálogo actualizado.
    async function actualizarCatalogo() {
      try {
        const datos = await pedirJSONP("catalogo");
        const lista = normalizarCatalogo(datos).filter(p =>
          p && typeof p.producto === "string"
        );

        if (!lista.length) {
          throw new Error("El catálogo recibido está vacío.");
        }

        // Leer la copia anterior ANTES de guardar la nueva.
        const anterior = leerCatalogoAnterior();

        if (anterior && anterior.length > 0) {
          const cambios = compararCatalogos(anterior, lista);

          if (cambios.length > 0) {
            guardarInformeCambios(cambios);
            mostrarAvisoCambios(cambios);
          }
        }

        catalogo = lista;
        guardarCatalogo(catalogo);
        actualizar();

        estado.textContent =
          "Catálogo actualizado desde Google Sheets: " +
          catalogo.length.toLocaleString("es") +
          " productos.";
      } catch (error) {
        if (catalogo.length) {
          estado.textContent =
            "Sin actualización del servidor. Usando los productos guardados.";
        } else {
          estado.textContent =
            "No se pudo cargar el catálogo. Comprueba internet.";
        }

        console.error("Error al actualizar el catálogo:", error);
      }
    }

    // Imagen de fondo: guardar una copia local para uso sin internet.
    function aplicarImagenFondo(imagen) {
      if (typeof imagen !== "string" ||
          !imagen.startsWith("data:image/")) {
        return;
      }

      document.body.style.backgroundImage =
        'linear-gradient(rgba(8,22,38,.58), rgba(8,22,38,.65)), url("' +
        imagen + '")';
    }

    function cargarImagenGuardada() {
      try {
        const imagen = localStorage.getItem(CLAVE_IMAGEN);
        if (imagen) aplicarImagenFondo(imagen);
      } catch (error) {
        console.warn("No se pudo recuperar la imagen guardada.", error);
      }
    }

    async function actualizarImagenFondo() {
      try {
        const respuesta = await pedirJSONP("imagen", 30000);

        const imagen = typeof respuesta === "string"
          ? respuesta
          : respuesta && (respuesta.imagen || respuesta.url);

        if (!imagen || !String(imagen).startsWith("data:image/")) {
          throw new Error("La respuesta no contiene una imagen válida.");
        }

        aplicarImagenFondo(imagen);

        try {
          localStorage.setItem(CLAVE_IMAGEN, imagen);
        } catch (error) {
          console.warn(
            "La imagen se mostró, pero no pudo guardarse para uso sin conexión.",
            error
          );
        }
      } catch (error) {
        console.warn("No se pudo actualizar la imagen de fondo:", error);
      }
    }

    // Eventos del buscador y de las categorías.
    document.getElementById("botones").addEventListener("click", evento => {
      const boton = evento.target.closest("button[data-categoria]");
      if (!boton) return;

      categoriaActiva = boton.dataset.categoria;

      document.querySelectorAll("#botones button").forEach(b => {
        b.classList.toggle("activo", b === boton);
      });

      entrada.value = "";
      actualizar();
    });

    entrada.addEventListener("input", () => {
      clearTimeout(temporizador);
      temporizador = setTimeout(actualizar, 120);
    });

    botonMas.addEventListener("click", () => {
      cantidadVisible += LIMITE_INICIAL;
      mostrarResultados();
    });

    // Iniciar con los datos guardados mientras llega la actualización.
    cargarImagenGuardada();
    cargarCopiaLocal();

    actualizarCatalogo();
    actualizarImagenFondo();

    // Actualizar cuando vuelva la conexión a internet.
    window.addEventListener("online", () => {
      actualizarCatalogo();
      actualizarImagenFondo();
    });

    // Mantener activo el funcionamiento sin conexión.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .then(() => {
            console.log("Modo sin conexión preparado.");
          })
          .catch(error => {
            console.error(
              "Error al activar el modo sin conexión:",
              error
            );
          });
      });
    }
  </script>
</body>
</html>
